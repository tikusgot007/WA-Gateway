org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# JANGAN tambahkan org.gradle.java.home=... di sini -- file ini ikut
# ter-commit ke git dan dipakai bersama, sedangkan path JDK berbeda-beda
# per mesin/OS (path Windows tidak akan ada di Mac/Linux/mesin developer
# lain). Kalau Gradle CLI (./gradlew) di mesinmu tidak otomatis menemukan
# JDK 17, set org.gradle.java.home di file gradle.properties level USER
# (BUKAN file project ini), yang letaknya di luar repo:
#   Windows: %USERPROFILE%\.gradle\gradle.properties
#   Mac/Linux: ~/.gradle/gradle.properties
# Untuk build lewat Android Studio (bukan terminal), cara yang lebih
# gampang: Settings > Build, Execution, Deployment > Build Tools > Gradle
# > "Gradle JDK" -- pilih JDK 17 dari situ, tidak perlu edit file apa pun.
